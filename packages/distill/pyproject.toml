[project]
name = "distill"
version = "0.1.0"
description = "LLM distillation: raw transcripts -> structured theses."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "core",
    "llm",
    "pydantic>=2",
    "pyyaml>=6",
    "requests>=2",
]

[project.scripts]
distill-roster = "distill.cli:roster_main"
distill-transcript = "distill.cli:transcript_main"
distill-canon = "distill.canon_cli:main"
distill-triage = "distill.triage_cli:main"
distill-migrate-ids = "distill.migrate_ids:main"
fetch-tickers = "distill.fetch_tickers:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
core = { workspace = true }
llm = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "integration: hits the network; run explicitly",
    # Needs a populated `data/` — machine-generated ore that is gitignored and never
    # committed, so these pass locally and cannot pass anywhere else. Deliberately NOT
    # folded into `integration`: that marker promises a network call, and a reader
    # deciding whether to run these needs to know it is a missing *file* that stops them.
    "needs_ore: reads cached ore from data/; run where the corpus exists",
]
