[project]
name = "llm"
version = "0.1.0"
description = "Subscription-backed Claude Code client — shared LLM boundary."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = ["integration: hits the network; run explicitly"]
