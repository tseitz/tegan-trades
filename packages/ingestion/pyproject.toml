[project]
name = "ingestion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tseitz", email = "tdseitz10@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "core",
    "pyyaml>=6.0.3",
    "requests>=2",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.7.4",
]

[project.scripts]
ingest-roster = "ingestion.cli:roster_main"
ingest-channel = "ingestion.cli:channel_main"
ingest-x = "ingestion.cli:x_main"
verify-roster = "ingestion.cli:verify_main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "integration: hits the network; run explicitly",
    # Needs a populated `data/` — machine-generated ore that is gitignored and never
    # committed, so these pass locally and cannot pass anywhere else. Deliberately NOT
    # folded into `integration`: that marker promises a network call, and a reader
    # deciding whether to run these needs to know it is a missing *file* that stops them.
    "needs_ore: reads cached ore from data/; run where the corpus exists",
]
