[project]
name = "ingestion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tseitz", email = "tdseitz10@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "core",
    "pyyaml>=6.0.3",
    "requests>=2",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.7.4",
]

[project.scripts]
ingest-roster = "ingestion.cli:roster_main"
ingest-channel = "ingestion.cli:channel_main"
ingest-x = "ingestion.cli:x_main"
verify-roster = "ingestion.cli:verify_main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = ["integration: hits the network; run explicitly"]
