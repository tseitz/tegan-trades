[project]
name = "compare"
version = "0.1.0"
description = "Put one protocol beside another in a comparison card"
requires-python = ">=3.12"
dependencies = [
    "core",
    # Reads the alt-signal store and the protocol identifier config, same seam
    # `oracle.altsignal_store`/`oracle.altsignal_config` expose to `review`.
    "oracle",
    "pyyaml>=6",
]

[project.scripts]
compare = "compare.cli:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
core = { workspace = true }
oracle = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "integration: hits the network; run explicitly",
    "needs_ore: reads cached ore from data/; run where the corpus exists",
]
