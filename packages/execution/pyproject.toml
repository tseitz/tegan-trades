[project]
name = "execution"
version = "0.1.0"
description = "Order execution: the only package that holds keys and sends signed writes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "core",
    "pyyaml>=6",
    # EIP-712 + msgpack action signing. Not hand-rolled deliberately: an incorrectly signed
    # action is rejected by the venue with no indication of *why*, which is indistinguishable
    # from a malformed order. Pulls eth-account, msgpack, websocket-client, requests.
    "hyperliquid-python-sdk>=0.24,<0.25",
    # Alpaca has no signing step — identity is an API key pair in a header — so it needs an
    # HTTP client and nothing else. Declared explicitly rather than leaned on transitively
    # through the Hyperliquid SDK, which `alpaca_broker` does not otherwise depend on.
    "requests>=2.31",
]

[project.scripts]
execute = "execution.cli:main"
book = "execution.book_cli:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "integration: hits the network; run explicitly",
    # Needs a populated `data/` — machine-generated ore that is gitignored and never
    # committed, so these pass locally and cannot pass anywhere else. Deliberately NOT
    # folded into `integration`: that marker promises a network call, and a reader
    # deciding whether to run these needs to know it is a missing *file* that stops them.
    "needs_ore: reads cached ore from data/; run where the corpus exists",
]
