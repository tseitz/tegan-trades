[project]
name = "oracle"
version = "0.1.0"
description = "Price oracle: daily OHLC for the corpus's assets, cached as regenerable ore."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "core",
    "execution",
    "pyyaml>=6",
    "requests>=2",
]

[project.scripts]
fetch-prices = "oracle.fetch_cli:main"
fetch-funding = "oracle.funding_cli:main"
score-roster = "oracle.score_cli:main"
setups = "oracle.setups_cli:main"
plaid-link = "oracle.plaid_cli:link"
plaid-sync = "oracle.plaid_cli:sync"
wallet-sync = "oracle.wallet_cli:sync"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
core = { workspace = true }
execution = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "integration: hits the network; run explicitly",
    # Needs a populated `data/` — machine-generated ore that is gitignored and never
    # committed, so these pass locally and cannot pass anywhere else. Deliberately NOT
    # folded into `integration`: that marker promises a network call, and a reader
    # deciding whether to run these needs to know it is a missing *file* that stops them.
    "needs_ore: reads cached ore from data/; run where the corpus exists",
]
