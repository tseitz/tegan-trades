[project]
name = "oracle"
version = "0.1.0"
description = "Price oracle: daily OHLC for the corpus's assets, cached as regenerable ore."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "core",
    "pyyaml>=6",
    "requests>=2",
]

[project.scripts]
fetch-prices = "oracle.fetch_cli:main"
fetch-funding = "oracle.funding_cli:main"
score-roster = "oracle.score_cli:main"
setups = "oracle.setups_cli:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = ["integration: hits the network; run explicitly"]
