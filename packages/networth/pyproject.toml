[project]
name = "networth"
version = "0.1.0"
description = "Record tonight's net worth, and read the history back"
requires-python = ">=3.12"
dependencies = [
    "core",
    "pyyaml>=6",
    "review",
    "treasury",
]

[project.scripts]
networth = "networth.cli:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
core = { workspace = true }
review = { workspace = true }
treasury = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "integration: hits the network; run explicitly",
    "needs_ore: reads cached ore from data/; run where the corpus exists",
]
