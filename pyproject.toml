# Workspace root. Not an importable package — it exists so that one `uv sync` puts every
# member's console script on one shared `.venv`, resolved against ONE lockfile.
#
# Before this file existed each package under `packages/` was an independent uv project with
# its own `uv.lock`, which meant `pydantic`, `pyyaml` and `requests` were resolved six
# separate times and were free to drift apart. One lock is the point; running commands from
# the repo root is the convenience that falls out of it.
[project]
name = "tegan-trades"
version = "0.1.0"
description = "Personal signal/trading platform — workspace root."
requires-python = ">=3.12"

# Every member, so a plain `uv sync` installs the whole pipeline and all 19 console scripts
# land in `.venv/bin`. Without these, `uv sync` would install the root alone and `uv run
# setups` from the root would fail.
dependencies = [
    "brain",
    "core",
    "distill",
    "execution",
    "ingestion",
    "llm",
    "oracle",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
# Virtual root: its dependencies get installed, but the root itself is never built.
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
brain = { workspace = true }
core = { workspace = true }
distill = { workspace = true }
execution = { workspace = true }
ingestion = { workspace = true }
llm = { workspace = true }
oracle = { workspace = true }

[tool.pytest.ini_options]
# Root-level run: `uv run pytest` collects every package's suite in one pass. Each member
# keeps its own identical block so `uv run --package <name> pytest` still works from anywhere.
testpaths = ["packages"]
markers = ["integration: hits the network; run explicitly"]

# Load-bearing for the combined run. Five packages each ship a `tests/__init__.py`, so under
# pytest's default "prepend" import mode all five try to import as the single top-level
# package `tests` and every module after the first collides. importlib mode derives a unique
# module name from the full path instead, which is the only thing that makes one root-level
# `pytest` able to see all six suites at once.
addopts = "--import-mode=importlib"
consider_namespace_packages = true
