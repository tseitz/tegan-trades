# Workspace root. Not an importable package — it exists so that one `uv sync` puts every
# member's console script on one shared `.venv`, resolved against ONE lockfile.
#
# Before this file existed each package under `packages/` was an independent uv project with
# its own `uv.lock`, which meant `pydantic`, `pyyaml` and `requests` were resolved six
# separate times and were free to drift apart. One lock is the point; running commands from
# the repo root is the convenience that falls out of it.
[project]
name = "tegan-trades"
version = "0.1.0"
description = "Personal signal/trading platform — workspace root."
requires-python = ">=3.12"

# Every member, so a plain `uv sync` installs the whole pipeline and all 21 console scripts
# land in `.venv/bin`. Without these, `uv sync` would install the root alone and `uv run
# setups` from the root would fail.
dependencies = [
    "brain",
    "core",
    "digest",
    "distill",
    "execution",
    "ingestion",
    "llm",
    "oracle",
    "review",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.uv]
# Virtual root: its dependencies get installed, but the root itself is never built.
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
brain = { workspace = true }
core = { workspace = true }
digest = { workspace = true }
distill = { workspace = true }
execution = { workspace = true }
ingestion = { workspace = true }
llm = { workspace = true }
oracle = { workspace = true }
review = { workspace = true }

[tool.ruff]
# One config at the root, like the lockfile: members inherit it, so a rule cannot mean one thing
# in `core` and another in `oracle`.
target-version = "py312"

[tool.ruff.lint]
# **Selected explicitly rather than inherited.** ruff's default set is not stable across
# releases — on this repo 0.16's defaults report 177 findings where the older `E4,E7,E9,F` core
# reports 23. Taking the default would mean a version bump silently changing what "clean" means,
# which is the same drift argument that put every package on one lockfile.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "DTZ", "RET", "SIM", "BLE", "RUF"]

# `E501` is deliberately absent. The line limit is not enforced because the comments here carry
# the reasoning and 52 of them run long on purpose; a rule that would be suppressed 52 times is
# not a rule. `ruff format` is likewise not adopted — 209 of 249 files would be rewritten, and
# that diff would bury `git blame` on the explanations.
ignore = [
    # Flags `–` and `−` in prose as confusable with `-`. They are neither typos nor smuggled
    # homoglyphs, they are how this repo writes; the rule is aimed at a threat model (a lookalike
    # character hiding in an identifier) that comments and docstrings do not have.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.pytest.ini_options]
# Root-level run: `uv run pytest` collects every package's suite in one pass. Each member
# keeps its own identical block so `uv run --package <name> pytest` still works from anywhere.
#
# `scripts` is here because the probes are not all display. `probe_replay.walk` decides which
# side a limit and a stop rest on, and a long and a short are mirror images — a sign error there
# reads perfectly and inverts the result. Anything under `scripts/` that only prints stays
# untested; anything that computes a number someone will quote does not.
testpaths = ["packages", "scripts"]
markers = [
    "integration: hits the network; run explicitly",
    # Needs a populated `data/` — machine-generated ore that is gitignored and never
    # committed, so these pass locally and cannot pass anywhere else. Deliberately NOT
    # folded into `integration`: that marker promises a network call, and a reader
    # deciding whether to run these needs to know it is a missing *file* that stops them.
    "needs_ore: reads cached ore from data/; run where the corpus exists",
]

# Load-bearing for the combined run. Five packages each ship a `tests/__init__.py`, so under
# pytest's default "prepend" import mode all five try to import as the single top-level
# package `tests` and every module after the first collides. importlib mode derives a unique
# module name from the full path instead, which is the only thing that makes one root-level
# `pytest` able to see all six suites at once.
addopts = "--import-mode=importlib"
consider_namespace_packages = true
