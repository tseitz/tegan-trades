# How much to risk, and where. Read by `packages/execution/config.py`.
#
# THIS FILE IS COMMITTED. It must never hold a private key — the signing key lives in `.env`
# (gitignored) as HYPERLIQUID_ACCOUNT_ADDRESS / HYPERLIQUID_SECRET_KEY. The loader has no
# field that would accept one, so a key placed here is a hard error rather than a secret in
# the history forever.
#
# Nothing here turns execution ON. That is `setups --execute`, a flag you type per run, so a
# setting cannot silently leave trading enabled from one session to the next.

# testnet | mainnet. Overridable per-run with `--network`; mainnet additionally requires a
# typed confirmation phrase before a session opens.
# Left unset on purpose: an unset network resolves to the venue's rehearsal (paper for
# alpaca, testnet for hyperliquid), so switching `venue` below cannot leave a stale network
# behind that names the other venue's rehearsal — or fails validation, as `testnet` did here.
# network: paper

# Fraction of account equity risked per trade, measured to the stop the engine computed.
# 0.01 = 1%. Equity is read live from the venue, so this stays honest as the balance moves.
risk_pct: 0.01

# Ceiling on position notional as a multiple of equity — a guard against risk-based sizing
# and a very tight zone combining into enormous leverage.
#
# 3.0 is measured, not taste: across the 77 decisions recorded to 2026-07-27 the tightest
# stop sits 0.51% from its entry, which at a 1% risk budget implies 2.0x. So this ceiling is
# inert on every candidate the engine has ever produced and engages only on a zone narrower
# than anything yet seen. Re-measure before lowering it, or it starts quietly resizing
# ordinary trades.
max_notional_frac: 3.0

# The largest share of the account any ONE position may be. Shares an arithmetic with the
# setting above and nothing else: that one bounds leverage, this one bounds concentration.
#
# WHY IT IS NEEDED SEPARATELY. Position size is inversely proportional to stop width, so a
# tight zone asks for a large position without asking for much leverage. Across the 47
# approved decisions to 2026-07-29 the median stop is 5.76% of entry, which at a 1% risk
# budget wants 17% of equity — nowhere near 3x, and yet only five or six such positions fit a
# 1x account. The leverage ceiling is inert on every one of them.
#
# 0.20 IS NOT A TAIL GUARD, and it is worth being honest about that up front: measured across
# the 47 approved decisions, it binds on 22 of them and cuts their realised risk to a median
# 0.56%. That is arithmetic, not a badly chosen number — `1/ceiling` positions fit at 1x, so
# concurrency and per-trade risk are ONE choice with two names. 20% buys five concurrent
# positions and costs about half the risk budget on the half of candidates it touches. Loosen
# it to 0.50 and only 6 of 47 bind, but two positions fill the account.
#
# What it does catch outright is the tail that made this necessary: SILVER daily, whose 0.05%
# stop wanted 1,921% of equity; YM at 114%; SPX at 71%; INTL at 49% — the one that filled and
# took half the account with it.
#
# Read `uv run python scripts/probe_portfolio_budget.py --sizing` before moving this. Its
# sweep prints bind rate and realised risk together, which is the only way to see the trade.
#
# APPLIES TO BOTH VENUES, and it was chosen on equity data. On a perp account a 20% cap is
# tighter than the venue would require, which is the safe direction but not a measured one.
# If Hyperliquid ever carries real size again this wants splitting per venue, alongside the
# same problem max_notional_frac has in the other direction (docs/IMPROVEMENTS.md §36).
max_position_frac: 0.20

# The risk ceiling for the WHOLE BOOK, across venues, as a share of combined equity.
#
# The only setting in this file that is not per-venue, and that is the point. Buying power
# cannot be pooled — there is no transfer path between a perp margin pool and equity buying
# power — but risk must be, because losing 1% on each of two accounts is losing 2% of one
# person's money. The comment on `venue` below used to name that as the thing to revisit before
# treating the two books as one account. This is that.
#
# MEASURED, and this is the sitting it exists for: on 2026-07-29 eight brackets went out between
# 03:24 and 04:01 ET, each sized to risk 1% of the same $100,000, and the account carried 7.94%
# in aggregate. Nothing computed that and nothing showed it; the way it surfaced was Alpaca
# rejecting three orders at the open, hours after this repo had logged them as placed. At 5% the
# first five go in full and the sixth is offered 3.2% of what it asked for — refused with the
# book named, rather than sent and killed later.
#
# 5% IS NOT AN INDEPENDENT CHOICE. `max_position_frac: 0.20` already says five positions fit a
# 1x account, and five positions at a 1% risk budget risk 5%. The two settings are one decision
# wearing two names, so moving either without the other makes one of them dead. Re-measure with
# `uv run python scripts/probe_portfolio_budget.py --risk` before changing it.
#
# Comment it out to switch the ceiling off entirely. It also switches off when no venue can
# report equity, because a ceiling computed from a zero denominator refuses every order — the
# same None-versus-zero asymmetry `packages/execution/account.py` is built on.
max_portfolio_risk: 0.05

# The floor under a budget-shrunk order, as a share of the size it was going to be.
#
# When the account cannot fit a whole order, the alternative to refusing is to send whatever
# fits — but that makes the risk taken an artefact of where the candidate fell in tonight's
# queue, since the eighth approval gets the remainder. So an order that can still carry at
# least this much of its intended risk is trimmed, and one that cannot is refused with the
# account named.
#
# This is the one number in this file that is CHOSEN rather than measured, and it is round on
# purpose so nobody reads precision into it. What would settle it is the decision sidecar
# (docs/IMPROVEMENTS.md §4) — whether shrunk orders get approved and held like full ones — and
# that needs shrunk orders to exist first. 0 means "always shrink"; 1 means "never shrink".
min_budget_fill: 0.5

# ── Kelly sizing ─────────────────────────────────────────────────────────────────────────
#
# The engine's measured win rate. UNSET means nobody has measured it, and while it is unset
# Kelly is off and every order takes the flat `risk_pct` above. Deliberately not `0.0`: a zero
# would read as "measured, and it never wins", which is a far stronger claim than silence.
#
# WHAT IT BUYS. `risk_pct` charges every trade the same 1% however good it looks, which is why
# 5% / 1% = exactly five positions fit the book, always. Kelly prices a trade by its own payoff
# instead — `f = p - (1-p)/b`, where `b` is this candidate's reward:risk, known exactly before
# the order goes out. Weak trades then stop paying full rent for a slot.
#
# WHY `p` IS ONE NUMBER AND NOT ONE PER CANDIDATE. Nothing in this repo predicts which
# individual setup wins: `scripts/probe_replay.py` puts the score's AUC against outcomes at
# 0.29, which is worse than chance and pointing backwards. A per-candidate `p` would therefore
# be invented. `b` is the opposite — measured per candidate, exactly — so `b` does the
# per-trade work and `p` is one engine-wide figure you update as the engine improves.
#
# MEASURED, and it is why this is still unset. `scripts/probe_evidence.py` over 57 as-of dates
# spanning 14 months, 591 resolved candidates on the thesis arm:
#
#   p 11.5%   b 3.08   break-even p 24.5%   Kelly f -17.2%
#
# Every arm came out negative, including a 5,021-row random-direction arm at 12.4%. So this
# engine currently needs to more than double its hit rate before Kelly would size anything.
# Re-run that probe and read the `break-even p` column before setting a number here.
#
# TWO CAVEATS THAT BOTH MAKE THE REAL NUMBER WORSE. `oracle.replay` fills a stop AT the stop,
# so gaps cost nothing in that sample and the true `b` is smaller than 3.08 — divide by
# `scripts/probe_gap_cost.py`'s slippage before trusting it. And `p` is measured on resolved
# rows only, which is winner-weighted censoring in the other direction; read `resolv` on the
# arm table to see how much is still open.
# kelly_win_rate: 0.31

# Multiplier on the Kelly fraction. 1.0 is full Kelly. The default 0.25 is not caution for its
# own sake — the asymmetry is exact: betting DOUBLE the Kelly fraction drives the long-run
# growth rate to exactly zero, while betting HALF still earns 75% of the maximum. Overbetting
# is a cliff and underbetting is a slope, so a quarter buys a wide margin for `p` being wrong.
# Full Kelly also carries a 50% chance of the account halving at some point, which is a
# property of the growth optimum rather than a tail event.
# kelly_fraction: 0.25

# The most any one trade may risk however good it looks. Kelly is unbounded as `b` grows — a
# 20R target on a tight zone asks for roughly a tenth of the account — and that arithmetic is
# only right if a 20R target is a thing that happens rather than a level someone drew.
# kelly_cap: 0.02

# Days a resting entry may sit before `uv run book` flags it as stale. Nothing is cancelled
# automatically — an unfilled entry is a live intention, and a weekly zone taking a month to
# be reached is the ordinary case, so a sweep would retire the patient trades first.
#
# 14 sits inside core.setups.CARRY_HOLD_DAYS (21), so a stale entry cannot outlive the holding
# period the carry model prices. The alternative it is measured against is the venue's own
# default: an Alpaca GTC bracket expires after 90 days, which means an approval nobody
# revisited holds a slice of the budget for a quarter.
max_order_age_days: 14

# The DEFAULT venue, and the tier anchor. No longer the decision.
#
# `hyperliquid` — perps, crypto and HIP-3 equities. Networks: testnet | mainnet.
# `alpaca`      — US equities and ETFs, long or short. Networks: paper | live.
#
# Which venue a trade goes to is now decided per candidate, by cost, in `core/routing.py` — the
# queue shows the winner, what it costs there, and the runner-up. This setting does two smaller
# jobs instead:
#
#   1. THE TIER ANCHOR. `network` below is read against this venue, and every other venue opens
#      at the same *tier* under its own name — so `network: mainnet` here also reaches Alpaca
#      `live`, because the fact they share is "real money" and not the word. Each real-money
#      venue takes its own typed confirmation, so declining one leaves the other routable.
#   2. THE FALLBACK, for a candidate routing has no answer for.
#
# A routed venue is never silently swapped for this one. If the router picks Alpaca and Alpaca
# is unreachable, the candidate is refused and recorded — placing it here instead would make
# the cost line the queue already printed a false statement about an order that exists.
#
# THE NETWORK IS PART OF THE VENUE, not a free-standing setting. Naming a venue without a
# network resolves to that venue's rehearsal (testnet / paper), never to the other venue's —
# and both real-money networks require the same typed confirmation, which is why the check
# reads the venue table rather than comparing against "mainnet" alone.
#
# The two accounts remain separate pools for buying power, because there is no transfer path
# between them. Risk is pooled across both — see `max_portfolio_risk` above, which is what
# stopped `risk_pct` being risked once per venue.
venue: alpaca

# Liquidity floors, in USD. Applied to EVERY market, not just HIP-3 ones — core-book markets
# can be thin too, healthy ones pass trivially, and a gate with an exemption list is a gate
# someone eventually routes around.
#
# WHY THIS EXISTS: HIP-3 lets anyone with a HYPE stake deploy a perp market and operate its
# oracle, so "the venue lists it" stopped being evidence that it trades. cfg/venue_map.yaml
# maps DXY to xyz:DXY, which on mainnet has $0 volume, $0 open interest and NOTHING QUOTED ON
# EITHER SIDE. An entry there would rest forever; a stop there could not fill at any price.
#
# The exposure is the stop, not the entry. An entry is a resting limit that simply doesn't
# fill in a dead market — a stop is a market order that must fill at the worst moment, and
# positions are held ~21 days (core.setups.CARRY_HOLD_DAYS). So these measure durability
# (will this market still be quoted in three weeks) rather than instantaneous depth.
#
# Measured on mainnet 2026-07-27. These clear xyz:DXY (nothing), xyz:URNM ($133k/day) and
# xyz:RIVN ($582k open interest) while keeping every market with genuine activity —
# xyz:SP500 quotes a TIGHTER spread than core-book BTC.
min_day_volume: 1000000
min_open_interest: 1000000

# The equity counterpart to the two floors above, and the one setting here that RESIZES rather
# than refuses. Fraction of a median trading session this order may be, measured over ~30
# sessions of daily bars. See `packages/execution/participation.py`.
#
# It caps instead of refusing because the size is derived from a risk budget: a market too
# thin to carry 1% of the account is not automatically a market not worth trading, it is one
# that can carry less. The shrunken order is printed with the cut and the market's own numbers
# beside it, and the confirmation prompt is unchanged — so the decision stays with the person,
# who now has the one fact they were missing. The shrunken risk IS the signal: an order capped
# to 1% of INTL's median session risks 0.15% of the account rather than the 1% configured.
#
# Measured 2026-07-28 across the eight then-queued candidates mapped to Alpaca. Participation
# of the risk-derived order against the median session:
#
#   INTL   6.6%    median 24,707 sh/day,        175 trades/day
#   SBSW   0.04%   median 5,358,410 sh/day,  26,862 trades/day
#   the other six: 0.00%
#
# That is one outlier and a floor, not a continuum — so anything from 0.1% to 5% separates
# them and 1% is chosen to sit far from both edges. It is inert on every candidate the engine
# has produced except INTL, which it cuts from 1,639 shares to 247.
max_participation: 0.01
