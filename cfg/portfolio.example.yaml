# Example portfolio for `uv run review`. Copy, don't edit in place:
#
#   cp cfg/portfolio.example.yaml data/portfolios/retirement.yaml
#
# The real files go under `data/portfolios/`, which is gitignored. This repo is public and
# share counts are not configuration — nothing with a position size in it belongs in `cfg/`.
# Same reason `.env.example` is committed and `.env` is not.
#
# Two ways to fill `positions:`. By hand is fine and always works. Or link the broker once
# with `uv run plaid-link <name>` and let `uv run plaid-sync` rewrite the list every night —
# a sync replaces only the `positions:` block, so every setting and comment above it survives.
# The two are interchangeable: nothing downstream can tell which wrote the file.

# Shown in the report header. Defaults to the filename.
account: retirement

# scalp | swing | position | macro — `core.thesis`'s own vocabulary, not a new one. It sets
# the default staleness tolerance below; a retirement book is `macro`, an actively traded
# account is `swing` or `scalp`.
horizon: macro

# When these positions were last true. OPTIONAL — without it the file's own modified time is
# used, which needs no bookkeeping and is usually what you meant. Set it explicitly when the
# mtime would lie (a file restored from backup, or touched for an unrelated edit).
# updated: 2026-08-27

# Days before `review` shouts that this file no longer describes the account. Defaults to the
# horizon's view half-life (scalp 3, swing 21, position 120, macro 360), which is the right
# shape but the wrong number for an account you actually trade — an active book goes wrong in
# days however long you intend to hold. Set it low there:
#
#   stale_after: 7

# What routing should assume these assets are. `crypto` is the only value treated specially
# (Coinbase/Kraken); everything else routes to Yahoo. The roster's corpus answers this for
# anything it discusses; this file answers it for the index funds nobody has ever mentioned.
domain: stock

# Which level sources the LEVELS section counts. All four when absent. Start wide, then cut
# back once you know which you actually read — on a decade-horizon account `daily_zone` is
# more than half the noise and the first thing worth dropping:
#
#   levels: [weekly_zone, range_edge]
#
# Valid names: weekly_zone, daily_zone, gap, range_edge. A name outside that set is refused
# rather than ignored, because a typo would match nothing and print an empty section that
# looks exactly like an account with no levels near it.
# levels: [weekly_zone, daily_zone, gap, range_edge]

# Which accounts inside one Plaid connection this file covers. All of them when absent, which
# is the right default — a broker that later opens a second sleeve should appear, not vanish.
#
# Two reasons to set it. To EXCLUDE an account you do not use: an empty one is silent right up
# until the day it is not, so naming the ones you want beats relying on the others staying at
# zero. And to keep two books apart when one login reaches both.
#
# Merging is usually right for accounts you think of as one thing — two IRAs are one retirement
# position, and the same ticker in both is one exposure, so summing them is the honest answer.
# Cash is the exception and is reported per account for exactly that reason.
#
# `plaid-link` and `plaid-sync` both print the ids and masks they found.
# plaid_accounts: [abc123, def456]

# Money that could go into a position today. WRITTEN BY `plaid-sync` — do not hand-edit it,
# the next sync overwrites it. Absent on a hand-kept file, which is not the same as zero: the
# report says nothing rather than telling you there is no room to add.
# cash: 3379.57
#
# And where it sits, written only when this file covers more than one account. The positions of
# two IRAs genuinely sum; their cash does not, because you cannot buy in the Roth with
# Traditional money. `review` prints this beside the ADDs, which is the one place it changes
# what you do.
# cash_by_account:
#   Roth IRA: 3379.57
#   Traditional IRA: 0.00

positions:
  # `shares` is required and must be positive. A closed position is deleted, not zeroed.
  # `cost` is the average price paid and is OPTIONAL — it only adds a profit/loss column,
  # and changes no verdict.
  #
  # `figi` and `mark` are written by `plaid-sync` and are the broker's own answer to "which
  # instrument is this, and what is it worth". `mark` is never used as a price — it is there to
  # be disagreed with. Every price in this repo is fetched by TICKER, so a wrong ticker returns
  # a confident wrong price and nothing downstream can tell; the broker priced the security the
  # shares actually sit in. When the two are far apart, `review` says so and `figi` is how you
  # settle which one is right.
  - ticker: VTI
    shares: 42.5
    cost: 210.40
    figi: BBG000BHTMY2
    mark: 318.44

  - ticker: QQQ
    shares: 18

  # Override the file-level domain per row when one account mixes both.
  - ticker: BTC
    shares: 0.35
    domain: crypto
