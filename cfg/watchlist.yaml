# Roster — source of truth for who we ingest.
#
# status: active    — ingest in Phase 1 (has a transcribable long-form feed)
#         candidate — X-only (via Grok digest), guest-only, or a discovered suggestion pending Tegan's review
#         dormant   — inactive / paywalled; not ingesting but kept for the record
#
# access (per channel): ok        — transcribable now (YouTube/podcast)
#                       grok      — covered by the daily Grok x_search digest (see x_grok_digest below)
#                       guest     — only appears as a guest on other channels (multi-host ingest needed)
#                       paid      — behind a paywall
#                       manual    — needs a human/bespoke path (e.g. Telegram channel)
#                       dormant   — feed inactive
#                       excluded  — reachable, deliberately not ingested (a judgment, not a gap)
#                       unknown
#
# `excluded` exists so the gap reports stay meaningful. `x_roster.undigested` flags handles
# declared on a person but absent from x_grok_digest — a real config gap worth catching, and
# the same silent-supply-gap class as the @RealVision typo. Once deliberate removals appear in
# it, the report nags on every run and starts getting ignored, which is exactly how that typo
# hid. A deliberate drop is marked, not silently left to look like an oversight.
#
# members: [..]  — for a multi-author feed, the people actually speaking on it. A feed is
#                  scored and counted as ONE voice (attribution is feed-level), so anything
#                  reporting a consensus split must label these rows or "5 bullish, 2 bearish"
#                  gets misread as seven independent opinions.
#
# Seed captured 2026-07-22 from Tegan's roster; enriched same day from channel-verification research.

