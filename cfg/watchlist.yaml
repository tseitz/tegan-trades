# ─── Machine-readable list for the daily Grok x_search digest (allowed_x_handles, max 20) ───
# Feeds the Brain-head sentiment layer. Honor the `degraded` flag = silence, not signal.
x_grok_digest:
  # Pruned 17 -> 12 on 2026-07-26 by Tegan, on the follow-list itself rather than on measured
  # output — these are "not what I want from X", which no signal metric can tell you.
  # Dropped: QuantMeta, 0xfhd_ (unfollowed) · thiccyth0t, Rewkang (meta/alpha, not calls —
  # moved to another list) · arthur0x (removed).
  #
  # Handle count drives xAI cost directly: the bill is dominated by *input tokens*, i.e. reading
  # each searched account's posts into context (measured: $0.59 of $0.82 on a text run). Every
  # handle removed is a real saving; filtering posts afterwards is not.
  - GiganticRebirth   # dormant for ages, kept deliberately — legendary, catches him if he surfaces
  - JustDeauIt
  - LomahCrypto       # returned nothing in the 07-24..26 window; unexplained, see below
  - CryptoCred        # meta more than calls — kept for the Brain head
  - DonAlt
  - cryptoalle        # posts chart images more than prose; needs --images to be worth anything
  - 0xmagiclines
  - pierre_crypt0     # KEEP. His YouTube is effectively dead (newest video 2026-07-01, 4 theses
                      # in 60 days) so X is his only live channel. A first pass flagged him as
                      # 3% signal and redundant; both were wrong — the metric was `$TICKER`-or-
                      # chart, which kept "Bonked by it indeed" and discarded "a fight for 65.5k
                      # ish: - If reclaimed, give another shot at mid June highs". He also posts
                      # in French, which the distiller has to handle or those vanish silently.
  - MarkNewtonCMT
  - LSDinmycoffee
  - Tradermayne
  # trader1sz removed 2026-07-26 — his YouTube livestreams turned out to be live, and that is
  # what's wanted from him. Was 29 posts/day at ~$3.04/mo, the second-largest line on the bill.
