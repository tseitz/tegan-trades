# Canonical asset -> the symbol each execution venue actually lists. Curated, and
# authoritative over every heuristic — for exactly the reasons cfg/oracle_map.yaml exists.
#
# WHY THIS FILE EXISTS. Matching a canonical symbol to a venue ticker by name is silently
# catastrophic, and the same collision that motivated oracle_map reproduces on the trading
# venues, where it would spend money instead of mis-grading a thesis:
#
#   SPX -> Hyperliquid's core book lists SPX6900, a memecoin, under "SPX" (mark 0.3296).
#          Lighter lists the same memecoin under "SPX" (mark 0.3295).
#          Aster lists it under "SPXUSDT" (mark 0.3298).
#          The S&P 500 is "SP500" (HL/xyz), "US500" (HL/km, Lighter) or "SPYUSDT" (Aster).
#          204 theses reference SPX. A name match here shorts a memecoin.
#
# EVERY ENTRY IS CONFIRMED BY PRICE, NEVER BY NAME. `scripts/probe_venue_coverage.py` asks
# each venue what its same-named market marks at and compares it to the last cached close for
# that canonical asset. Identity then settles itself — SPX closed 7428 against that 0.33 mark,
# a ratio of 4e-5 rather than a judgement call. Re-run it before adding anything, and read its
# DIFFERS notes before overruling it: a venue disagreeing with our close is sometimes our own
# stale price, and sometimes a different instrument wearing the same ticker.
#
# THE SCALE TRAP. Where a venue only offers an ETF proxy, the instrument tracks the index at
# a ratio that is NOT shared and NOT stable: SPY is ~1/10.03 of SPX, QQQ is ~1/41.08 of NDX,
# IWM ~1/10.05 of RUT. `scale` records the observed ratio (index / venue instrument) so the
# mismatch is at least visible — but it drifts with dividends and expense ratio, so prefer
# converting a thesis target to a PERCENTAGE move at signal time over multiplying by this
# number. `execution/guards.py` refuses a scaled listing outright rather than trusting it.
#
# The same venue market appears twice in this file when two canonical assets point at it, and
# only one of them is scaled: `SPX` maps to Aster's SPYUSDT at scale 10.03 because the thesis
# is quoted on the index, while `SPY` maps to the identical market at 1:1 because that thesis
# is quoted on the ETF. The scale belongs to the pairing, not to the market.
#
# `pricing` is deliberately absent from this file. Price routing stays in oracle_map.yaml
# against the index itself (^GSPC). Execution and pricing are different questions and
# collapsing them regrades every stored thesis against the wrong instrument.
#
# Venues: hyperliquid (core), hyperliquid:<dex> (HIP-3 builder), lighter, aster, alpaca.
# An asset a venue does not list is OMITTED, never guessed. Absence is a real answer.
#
# ALPACA IS THE ONE VENUE WHERE THE PRICE CHECK DOES NOT WORK, and it is mapped by a different
# rule because of it. Everywhere else the probe compares a venue's mark to our own close and
# identity settles itself. Alpaca's symbol for an equity is the same ticker our own close is
# fetched under, so the two numbers agree by construction and the comparison is circular — it
# would confirm every row, including a wrong one.
#
# So the evidence here is the INSTRUMENT, not the mark: each entry was resolved to a named
# company or fund on a named US exchange, and only EQUITY or ETF on NYSE/Nasdaq/NYSEArca/Cboe
# was mapped. That check is not ceremony. Resolving this file's canonical symbols as bare
# tickers turns up real, liquid, completely wrong instruments for a large share of the crypto
# section — `LINK` is Interlink Electronics, `NEAR` is a bond ETF, `DASH` is DoorDash, `BCH` is
# Banco de Chile, `TAO` is a China real-estate ETF. **Only the equities, funds and
# previously-unlisted sections carry an `alpaca` key.** Never extend it by pattern.
#
# Two whole categories are omitted from Alpaca on purpose. **Indices and futures** (`SPX`,
# `NDX`, `RUT`, `GOLD`, `OIL`, `NATGAS`, the metals, all FX) are not tradable there at all;
# where a fund tracks one it already has its own 1:1 row (`SPY`, `QQQ`, `IWM`, `URA`), which is
# the split this file's header already describes. **Commodity ETF proxies** were considered and
# rejected: `USO` and `UNG` carry roll decay that compounds over `core.setups.CARRY_HOLD_DAYS`,
# so a flat three weeks in crude still loses money in the proxy. That is a different trade, not
# a scaled one, and `scale` cannot express it.
#
# ONLY THE CORE BOOK AND THE `xyz` BUILDER ARE MAPPED ON HYPERLIQUID. The venue carries nine
# HIP-3 builders and three others (hyna, mkts, para) list markets this corpus prices. They are
# left out because `execution/broker.py` assumes USDC backs every perp it trades, which is
# verified for core and xyz and unverified for the rest — and a market backed by something
# else is sized against a balance that is not collateral. Confirm the collateral token before
# mapping a new dex, not the mark.
#
# Aster lists many assets twice, quoted in USDT and in USD. The USDT market is mapped
# throughout; both were confirmed, and picking per-asset would make the file's shape carry
# information it does not have.

