  # ── indices: proxies, with the scale trap above in force ────────────────────
  SPX:
    hyperliquid: "xyz:SP500"      # the index itself, 1:1
    lighter: US500                # the index itself, 1:1
    aster: SPYUSDT                # ETF proxy
    scale: {aster: 10.03}
  NDX:
    hyperliquid: "xyz:XYZ100"     # the index itself, 1:1
    lighter: US100                # the index itself, 1:1
    aster: QQQUSDT                # ETF proxy
    scale: {aster: 41.08}
  RUT:
    lighter: IWM                  # ETF proxy; both books are effectively dead (<$2k/day)
    aster: IWMUSDT
    # Measured 10.06 (Lighter) and 10.04 (Aster) against ^RUT the same session. This entry
    # carried no `scale` at all until the price probe caught it, which meant `is_proxy` was
    # False and an order quoted on the index would have gone out against an instrument at
    # a tenth of the price. The other two index entries had it; this one was simply missed.
    scale: {lighter: 10.05, aster: 10.05}
