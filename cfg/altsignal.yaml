# Alt-signal tracking list. Hand-curated, same spirit as oracle_map.yaml: explicit, checked
# into git, never auto-discovered.
#
# `chains:` feeds oracle/altsignal/defillama.py — `asset` is the ticker a holding is written
# under in a portfolio file; `chain` is DefiLlama's own slug for it, which does not always
# match the ticker (`solana`, not `SOL`).
#
# `markets:` feeds oracle/altsignal/{kalshi,polymarket}.py. Kalshi tickers name one specific
# strike/market — a series like KXFED covers every strike at every future meeting, so picking
# which ones are worth watching is a deliberate choice, not something to auto-discover.
# Polymarket entries name an event slug, which can expand to several readings when the event
# nests more than one market (see polymarket.py's docstring).
#
# Tickers/slugs below were pulled live from each platform's public API on 2026-09-03 and WILL
# go stale — Kalshi rolls to a new event per Fed meeting, Polymarket's yearly BTC/ETH target
# events roll at year-end. Re-pull from the live market list rather than guessing a successor
# ticker by pattern.
#
# `protocols:` feeds oracle/altsignal/{defillama,coingecko}.py's protocol-level fetching and
# packages/compare. A ticker is not an identifier — DefiLlama, CoinGecko and a venue's own API
# each name a protocol differently, and none of the three agree with each other or with the
# ticker (`docs/research/protocol-comparison-metrics.md` §3):
#   - `llama_fees` / `llama_tvl` are DefiLlama parent or child *slugs*, not the DefiLlama
#     parent id — a wrong slug answers HTTP 200 with an EMPTY BODY, which reads as "no data"
#     rather than "wrong name". Confirm any new row by hitting `/tvl/{slug}` and checking the
#     body is non-empty, not by guessing from the name.
#   - `llama_oi` is a LIST of DefiLlama child slugs under `/overview/open-interest` — one
#     protocol can be split into several rows there (Lighter is `lighter-perps` +
#     `lighter-robinhood-perps`), and summing only one row would undercount its open interest.
#   - `coingecko` is the CoinGecko coin `id` for `/coins/markets` (market cap, FDV, supply).
#     It is a copy of `gecko_id` off the DefiLlama *parent* object, not an independent check —
#     confirmed here by price agreement, the same way `oracle_map.yaml` rows are confirmed.
#   - `coingecko_derivatives` is a LIST of ids in CoinGecko's *derivatives-exchange* namespace
#     (`/derivatives/exchanges`) — a different id space from `coingecko` above (`aster-2` the
#     coin vs `aster` the exchange), and split into several rows the same way `llama_oi` is.
#   - `venue` names which adapter under `oracle/sources/` reads per-market detail. No reader
#     consumes it yet — reserved for a future ticket, kept here so it does not need re-adding.

protocols:
  - asset: HYPE
    llama_fees: hyperliquid
    llama_tvl: hyperliquid
    llama_oi: [hyperliquid-perps]
    coingecko: hyperliquid
    coingecko_derivatives: [hyperliquid]
    venue: hyperliquid
  - asset: LIT
    llama_fees: lighter
    llama_tvl: lighter
    llama_oi: [lighter-perps, lighter-robinhood-perps]
    coingecko: lighter
    coingecko_derivatives: [lighter, robinhood-chain-lighter-futures]
    venue: lighter
  # Confirmed live 2026-09-16 against /overview/open-interest and /derivatives/exchanges.

chains:
  - asset: SOL
    chain: solana
  - asset: ETH
    chain: ethereum
  # DefiLlama's chain TVL is a DeFi-usage metric — a chain with ~no native DeFi (e.g. plain
  # BTC) will read as ~0. That's an accurate reading, not an error.

markets:
  - platform: kalshi
    ticker: "KXFED-26DEC-T3.75"
    why: "Fed funds rate above 3.75% after the Dec 2026 meeting — roster references Fed policy constantly"
  - platform: kalshi
    ticker: "KXNBERRECESSQ-Q4-2025"
    why: "NBER recession call for the current quarter"
  - platform: polymarket
    slug: "us-recession-by-end-of-2026"
    why: "Direct recession-odds market, cross-checks the Kalshi read above"
  - platform: polymarket
    slug: "what-price-will-bitcoin-hit-before-2027"
    why: "BTC price-target market — expands to one reading per strike"
  - platform: polymarket
    slug: "what-price-will-ethereum-hit-before-2027"
    why: "ETH price-target market — expands to one reading per strike"
