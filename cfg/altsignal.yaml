# Alt-signal tracking list. Hand-curated, same spirit as oracle_map.yaml: explicit, checked
# into git, never auto-discovered.
#
# `chains:` feeds oracle/altsignal/defillama.py — `asset` is the ticker a holding is written
# under in a portfolio file; `chain` is DefiLlama's own slug for it, which does not always
# match the ticker (`solana`, not `SOL`).
#
# `markets:` feeds oracle/altsignal/{kalshi,polymarket}.py. Kalshi tickers name one specific
# strike/market — a series like KXFED covers every strike at every future meeting, so picking
# which ones are worth watching is a deliberate choice, not something to auto-discover.
# Polymarket entries name an event slug, which can expand to several readings when the event
# nests more than one market (see polymarket.py's docstring).
#
# Tickers/slugs below were pulled live from each platform's public API on 2026-09-03 and WILL
# go stale — Kalshi rolls to a new event per Fed meeting, Polymarket's yearly BTC/ETH target
# events roll at year-end. Re-pull from the live market list rather than guessing a successor
# ticker by pattern.
#
# `protocols:` feeds oracle/altsignal/{defillama,coingecko}.py's protocol-level fetching and
# packages/compare. A ticker is not an identifier — DefiLlama, CoinGecko and a venue's own API
# each name a protocol differently, and none of the three agree with each other or with the
# ticker (`docs/research/protocol-comparison-metrics.md` §3):
#   - `llama_fees` / `llama_tvl` are DefiLlama parent or child *slugs*, not the DefiLlama
#     parent id — a wrong slug answers HTTP 200 with an EMPTY BODY, which reads as "no data"
#     rather than "wrong name". Confirm any new row by hitting `/tvl/{slug}` and checking the
#     body is non-empty, not by guessing from the name.
#   - `llama_oi` is a LIST of DefiLlama child slugs under `/overview/open-interest` — one
#     protocol can be split into several rows there (Lighter is `lighter-perps` +
#     `lighter-robinhood-perps`), and summing only one row would undercount its open interest.
#   - `coingecko` is the CoinGecko coin `id` for `/coins/markets` (market cap, FDV, supply).
#     It is a copy of `gecko_id` off the DefiLlama *parent* object, not an independent check —
#     confirmed here by price agreement, the same way `oracle_map.yaml` rows are confirmed.
#   - `coingecko_derivatives` is a LIST of ids in CoinGecko's *derivatives-exchange* namespace
#     (`/derivatives/exchanges`) — a different id space from `coingecko` above (`aster-2` the
#     coin vs `aster` the exchange), and split into several rows the same way `llama_oi` is.
#   - `venue` names which adapter under `oracle/sources/` reads per-market detail. No reader
#     consumes it yet — reserved for a future ticket, kept here so it does not need re-adding.
#
# `venues:` feeds oracle/altsignal/defillama.py's `fetch_venues` and `core.safety` (the Safety
# gate, #73) — a DIFFERENT identifier space from `protocols:` above, even where a slug repeats:
#   - `venue` must match a `data/treasury.yaml` row's `venue:` field exactly — this is what
#     `treasury` looks a row's safety facts up by, and what its advice prints. Wrong, and a
#     parked row silently shows no safety.
#   - `llama_protocol` is a DefiLlama protocol slug for `/protocols` and `/protocol/{slug}` —
#     same failure mode as `llama_fees`/`llama_tvl` above: a wrong slug answers HTTP 200 with
#     an EMPTY BODY, which reads as "no data" rather than "wrong name".
#   - `llama_pools` is a LIST of DefiLlama pool uuids from `yields.llama.fi/pools` — one
#     protocol serves several pools (aave-v3 alone serves six `stablecoin: true` pools on
#     Ethereum), and a single hand-picked uuid would decide what gets ranked by whichever pool
#     someone happened to paste. Every listed pool ranks as its own candidate.
#   - `asset` is the ticker this venue accepts, as a portfolio or treasury file writes it.
#   - `chain` is DefiLlama's DISPLAY chain name, not its slug — `OP Mainnet`, not `Optimism`;
#     `Optimism` and `Matic` both return zero pools.
#
# `wrappers:` feeds oracle/altsignal/defillama.py's `fetch_venues` (same reader as `venues:`
# above, unchanged — see #74) and `review.yield_note` — a THIRD identifier space, answering "if
# you hold this asset bare, what receipt token pays more for the same exposure":
#   - `asset` is the CANONICAL asset per `cfg/assets.yaml`, not the ticker a portfolio file
#     happens to use. This is the field most likely to be got wrong: `resolve_asset("WETH")`
#     returns `"ETH"` because WETH genuinely IS ether (`cfg/assets.yaml:11`), so a row written
#     `asset: WETH` matches nothing, ever, on a book that holds WETH. Write the canonical name.
#   - `wrapper` is the receipt token's ticker, as `wallet-sync` would write it to a portfolio
#     file (`METH`, `STETH`) — cosmetic, read only for the note's own wording.
#   - `contract` is the receipt token's address, and it is what "already held" is read from: a
#     position's `figi` is compared against this, case-insensitively, to drop a wrapper you
#     already hold from the suggestion. Confirmed through
#     `coins.llama.fi/prices/current/<chain>:<addr>` by symbol, never guessed from a ticker.
#   - `llama_protocol`/`llama_pools` are spelled exactly as `venues:` spells them and read by
#     the same `fetch_venues` call — a protocol named in both blocks collapses to one reading.
#   - No `chain:` field, unlike `venues:` — nothing here reads one.
#   - Two rows must not name the same pool uuid; the loader does not catch it, and the second
#     one silently wins.
#
# NOT `cfg/oracle_map.yaml`'s `wraps:` block. That one redirects a FUND's roster fold (`HODL`
# borrows BTC's sentiment) while still pricing the fund on its own ticker — this block is about
# which RECEIPT TOKEN pays more for holding the same asset, and never touches pricing or roster
# folds at all. NOT a `cfg/assets.yaml` alias either — an alias reprices a holding outright
# (`WETH` -> `ETH`'s price), where this block leaves both instruments priced as themselves and
# only compares which one is a better place to park the exposure.
#
# Two DefiLlama fields mean "parent" and they are NOT the same relation. `forkedFromIds` is
# lineage — what the Safety gate reads to find a validated fork's parent. `parentProtocol` is
# DefiLlama's own grouping of a protocol family (`aave-v3` groups under `parent#aave`) — reading
# it as lineage would hand a protocol its own family as a "validated parent", which is not what
# ADR-0006 means by "a specific parent protocol [that] already clears this same gate".
#
# This list of slugs and pool uuids is NOT the hand-kept trustworthy-venue allowlist ADR-0006
# forbids. What is forbidden is a list of venues judged safe by whoever edited this file; every
# fact the gate actually decides on (audit, age, lineage) is read fresh from DefiLlama at fetch
# time, never asserted here. This file only says which protocols and pools to ask about.
#
# `sparklend` forks from `aave-v3` (confirmed live 2026-09-17: `forkedFromIds: ["1599"]`,
# `1599` -> `aave-v3`) — the one row here that actually exercises a validated-fork lineage
# resolution. `aave-v3` and `lido` both carry `forkedFromIds: None`, so seeding only a
# standalone protocol would ship the fork-lineage code path fixture-only.

protocols:
  - asset: HYPE
    llama_fees: hyperliquid
    llama_tvl: hyperliquid
    llama_oi: [hyperliquid-perps]
    coingecko: hyperliquid
    coingecko_derivatives: [hyperliquid]
    venue: hyperliquid
  - asset: LIT
    llama_fees: lighter
    llama_tvl: lighter
    llama_oi: [lighter-perps, lighter-robinhood-perps]
    coingecko: lighter
    coingecko_derivatives: [lighter, robinhood-chain-lighter-futures]
    venue: lighter
  # Confirmed live 2026-09-16 against /overview/open-interest and /derivatives/exchanges.

venues:
  - venue: aave-v3
    llama_protocol: aave-v3
    llama_pools: [aa70268e-4b52-42bf-a116-608b370f9501, 6f00d46b-8735-49ae-9ced-2a0fccc56ad0]
    asset: USDC
    chain: Ethereum
  - venue: sparklend
    llama_protocol: sparklend
    llama_pools: [65ce8276-b4d9-41ba-9f6f-21fc374cf9bc]
    asset: USDC
    chain: Ethereum
  # Confirmed live 2026-09-17 against /protocols and /pools. Both USDC pools under aave-v3
  # are real rows (3.60% at count 1316, 5.26% at count 124 with a reward component) — see the
  # header above for why a protocol lists more than one pool.

wrappers:
  - asset: ETH
    wrapper: STETH
    contract: "0xae7ab96520DE3A18E5e111B5EaAb095312D7fE84"
    llama_protocol: lido
    llama_pools: [747c1d2a-c668-4682-b9f9-296708a3dd90]
  - asset: ETH
    wrapper: RETH
    contract: "0xae78736Cd615f374D3085123A210448E74Fc6393"
    llama_protocol: rocket-pool
    llama_pools: [d4b3c522-6127-4b89-bedf-83641cdcd2eb]
  - asset: ETH
    wrapper: METH
    contract: "0xd5F7838F5C461fefF7FE49ea5ebaF7728bB0ADfa"
    llama_protocol: meth-protocol
    llama_pools: [b9f2f00a-ba96-4589-a171-dde979a23d87]
  # Pool uuids and contract addresses confirmed live 2026-09-17 against /pools and
  # coins.llama.fi/prices/current. The aave-v3/sparklend WETH supply pools are deliberately not
  # seeded here — ADR-0008:10 enumerates staking and locking as what "price exposure that
  # accrues" means, and a lending receipt adds bad-debt and counterparty risk a validator does
  # not carry. `meth-protocol` is seeded because mETH is the one wrapper this held book actually
  # carries (`data/portfolios/crypto.yaml`).

chains:
  - asset: SOL
    chain: solana
  - asset: ETH
    chain: ethereum
  # DefiLlama's chain TVL is a DeFi-usage metric — a chain with ~no native DeFi (e.g. plain
  # BTC) will read as ~0. That's an accurate reading, not an error.

markets:
  - platform: kalshi
    ticker: "KXFED-26DEC-T3.75"
    why: "Fed funds rate above 3.75% after the Dec 2026 meeting — roster references Fed policy constantly"
  - platform: kalshi
    ticker: "KXNBERRECESSQ-Q4-2025"
    why: "NBER recession call for the current quarter"
  - platform: polymarket
    slug: "us-recession-by-end-of-2026"
    why: "Direct recession-odds market, cross-checks the Kalshi read above"
  - platform: polymarket
    slug: "what-price-will-bitcoin-hit-before-2027"
    why: "BTC price-target market — expands to one reading per strike"
  - platform: polymarket
    slug: "what-price-will-ethereum-hit-before-2027"
    why: "ETH price-target market — expands to one reading per strike"
